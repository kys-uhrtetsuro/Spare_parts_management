name: Windows Nuitkaビルド

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: standalone EXEビルド
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: EXE成果物保存
        uses: actions/upload-artifact@v4
        with:
          name: SparePartsManagement-standalone
          path: build/launcher.dist/
          if-no-files-found: error
