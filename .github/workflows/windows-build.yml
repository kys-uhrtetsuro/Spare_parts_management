name: Windows Nuitkaビルド

on:
  workflow_dispatch:
  push:
    branches: [Release]
    tags:
      - "v*"
    paths-ignore:
      - "releases/**"
      - "docs/progress.md"
      - "assets/spare_parts.ico"
      - "frontend/src/assets/spare_parts.png"
      # Workflow-only changes do not alter the packaged app. Use manual dispatch
      # for a build-configuration-only change.
      - ".github/workflows/windows-build.yml"

# Every branch/tag dispatch belongs to one build slot. A newer run cancels
# an older run before its Windows compiler can publish outdated binaries.
concurrency:
  group: spare-parts-windows-standalone
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  stop-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: 旧Windowsビルドを停止
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'windows-build.yml', per_page: 100
            });
            const old = runs.filter(r =>
              r.id < context.runId &&
              ['requested', 'waiting', 'pending', 'queued', 'in_progress'].includes(r.status)
            );
            for (const run of old) {
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info(`停止指示: #${run.id} (${run.head_sha})`);
              } catch (error) {
                if ([404, 409, 422].includes(error.status)) {
                  core.info(`既に終了: #${run.id} (${error.status})`);
                } else {
                  throw error;
                }
              }
            }
            core.info(`旧ビルド ${old.length} 件の停止を要求しました`);
  build:
    needs: stop-outdated
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # Nuitka writes ccache/clcache and its other compilation caches here.
      # GitHub runners are ephemeral; restore/save makes the directory persistent.
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - name: ソース取得
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Nuitkaコンパイルキャッシュを復元
        id: nuitka-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          # Unique per run (immutable cache); previous compatible build is restored
          # using the prefix below. Package/Python/OS changes split the cache.
          key: nuitka-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt') }}-
      - name: Nuitka standaloneとC製ランチャーをビルド（Cコンパイル率表示）
        id: nuitka-build
        shell: pwsh
        run: |
          # Nuitka/tqdm disables interactive progress bars on non-TTY runners.
          # Count C translation units and their compiled objects instead.
          # Changes only the Actions wrapper, not Nuitka's build parameters.
          $ErrorActionPreference = 'Stop'
          $buildJob = Start-ThreadJob -ArgumentList (Get-Location).Path -ScriptBlock {
            param($repoRoot)
            Set-Location $repoRoot
            & ./scripts/build_windows.ps1
          }
          $lastMessage = ''
          $lastReport = [DateTime]::MinValue
          $sourceCount = 0
          $compiledCount = 0
          try {
            while ($buildJob.State -in @('Running', 'NotStarted')) {
              # Pass through Nuitka's original output, including compiler errors.
              Receive-Job -Job $buildJob -ErrorAction Continue | Out-Host
              $buildDir = 'build/launcher.build'
              $message = '[Cコンパイル] Cソース生成・コンパイル開始待ち'
              if (Test-Path -LiteralPath $buildDir -PathType Container) {
                $sourceCount = @(Get-ChildItem -LiteralPath $buildDir -Recurse -File -Filter '*.c' -ErrorAction SilentlyContinue).Count
                $compiledCount = @(Get-ChildItem -LiteralPath $buildDir -Recurse -File -Filter '*.obj' -ErrorAction SilentlyContinue).Count
                if ($sourceCount -gt 0) {
                  $done = [Math]::Min($compiledCount, $sourceCount)
                  $percent = [Math]::Round(100.0 * $done / $sourceCount, 1)
                  $message = "[Cコンパイル概算] $percent% ($done/$sourceCount CファイルのOBJを生成済み)"
                  if ($done -eq $sourceCount) {
                    $message += ' - Cコンパイル完了、リンク・配布処理は別'
                  }
                }
              }
              # Avoid spamming Actions logs; always emit a heartbeat within a minute.
              if ($message -ne $lastMessage -or ((Get-Date) - $lastReport).TotalSeconds -ge 60) {
                Write-Host $message
                $lastMessage = $message
                $lastReport = Get-Date
              }
              Start-Sleep -Seconds 15
            }
            Receive-Job -Job $buildJob -ErrorAction Continue | Out-Host
            if ($buildJob.State -ne 'Completed') {
              throw "Nuitkaビルドに失敗しました: $($buildJob.State)"
            }
            Write-Host 'Nuitka standaloneとC製ランチャーのビルド成功'
          } finally {
            if ($buildJob.State -in @('Running', 'NotStarted')) {
              Stop-Job -Job $buildJob
            }
            Remove-Job -Job $buildJob -Force
          }
      - name: Nuitkaコンパイルキャッシュを保存
        if: ${{ steps.nuitka-build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}
      - name: Standalone成果物を保存
        uses: actions/upload-artifact@v7
        with:
          name: SparePartsManagement-standalone
          path: build/SparePartsManagement-package/
          if-no-files-found: error
      - name: Standalone ZIPをreleasesへ配布登録
        if: ${{ github.ref == 'refs/heads/Release' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'build/SparePartsManagement-package'
          $outer = "$package/SparePartsManagement.exe"
          $inner = "$package/src/SparePartsManagement.exe"
          $locale = "$package/src/django/conf/locale/ja/LC_MESSAGES/django.mo"
          foreach ($required in @($outer, $inner, $locale)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "成果物がありません: $required" }
          }
          $rootFiles = @(Get-ChildItem $package -File)
          if ($rootFiles.Count -ne 1 -or $rootFiles[0].Name -ne 'SparePartsManagement.exe') {
            throw '配布フォルダのルートに予期しないファイルがあります'
          }
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          $zip = 'releases/SparePartsManagement-standalone.zip'
          Compress-Archive -Path "$package/*" -DestinationPath $zip -CompressionLevel Optimal -Force

          git fetch origin $env:GITHUB_REF_NAME
          $remoteHead = (git rev-parse FETCH_HEAD).Trim()
          $sourceHead = (git rev-parse HEAD).Trim()
          if ($remoteHead -ne $sourceHead) {
            $changedPaths = @(git diff --name-only $sourceHead $remoteHead)
            $codeChanges = @($changedPaths | Where-Object { $_ -notin @('docs/progress.md', 'README.md') })
            if ($codeChanges.Count -gt 0) {
              Write-Host 'コードが更新されたため旧ビルドの登録を中止します'
              exit 0
            }
            git merge --ff-only FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw '進捗文書更新を取り込めませんでした' }
          }

          $zipSize = (Get-Item $zip).Length
          $tag = "windows-$($sourceHead.Substring(0,12))"
          # Keep GitHub-recommended Git blob size below 50 MB; larger ZIPs are release assets.
          $useReleaseAssets = $zipSize -gt 45MB
          if ($useReleaseAssets) {
            # 'release view' intentionally returns 1 for a missing tag; avoid native
            # command errors being promoted to terminating PowerShell errors.
            $releaseTags = @(gh release list --limit 100 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName })
            if ($LASTEXITCODE -ne 0) { throw '既存GitHub Releasesの取得失敗' }
            if ($tag -in $releaseTags) {
              gh release upload $tag "$zip#SparePartsManagement-standalone.zip" --clobber
            } else {
              gh release create $tag "$zip#SparePartsManagement-standalone.zip" --target $sourceHead --title "Windows配布 $($sourceHead.Substring(0,12))" --notes "Nuitka standalone。ZIPを全展開してルートのEXEを起動してください。既存data/は維持してください。"
            }
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Releases登録失敗' }
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $progressPath = 'docs/progress.md'
          $progress = Get-Content $progressPath -Raw -Encoding UTF8
          $progress = $progress -replace '(?m)^- Windows standalone:.*$', '- Windows standalone: ZIP配布済み。Windows実機GUIとセキュリティソフトは未確認'
          $progress = $progress -replace '(?m)^\| Nuitka Windows standalone \|[^\r\n]*$', '| Nuitka Windows standalone | src集約＋C製ランチャー実装 | Windowsビルド成功・ZIP配布済み | 未確認 |'
          $progress = $progress -replace '(?m)^- Standalone配布ビルド元:.*\r?\n', ''
          $progress = $progress -replace '(?m)^- Standalone配布ZIP:.*\r?\n', ''
          $progress += [Environment]::NewLine + "- Standalone配布ビルド元: $sourceHead"
          $progress += [Environment]::NewLine + "- Standalone配布ZIP: $zipSize bytes（Git制限超過時はGitHub Releases）" + [Environment]::NewLine
          Set-Content -Path $progressPath -Value $progress -Encoding UTF8

          git add docs/progress.md assets/spare_parts.ico frontend/src/assets/spare_parts.png
          git rm -f --ignore-unmatch releases/SparePartsManagement.exe
          if ($useReleaseAssets) {
            git rm -f --ignore-unmatch releases/SparePartsManagement-standalone.zip
          } else {
            git add -f releases/SparePartsManagement-standalone.zip
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '配布成果物に変更はありません'
            exit 0
          }
          git commit -m 'Windows standalone配布ZIPと進捗を更新'
          if ($LASTEXITCODE -ne 0) { throw 'Gitコミット失敗' }
          git push origin HEAD:$env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Gitプッシュ失敗' }
