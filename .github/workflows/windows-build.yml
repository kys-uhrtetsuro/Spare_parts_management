name: Windows Nuitkaビルド

on:
  workflow_dispatch:
  push:
    branches: [Release]
    tags:
      - "v*"
    paths-ignore:
      - "releases/**"
      - "docs/progress.md"
      - "assets/spare_parts.ico"
      - "frontend/src/assets/spare_parts.png"
      # Workflow-only changes do not alter the packaged app. Use manual dispatch
      # for a build-configuration-only change.
      - ".github/workflows/windows-build.yml"

# Only the latest Release Onefile build should run.
concurrency:
  group: spare-parts-windows-onefile
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  stop-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: 旧Windowsビルドを停止
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'windows-build.yml', per_page: 100
            });
            const old = runs.filter(r =>
              r.id < context.runId &&
              ['requested', 'waiting', 'pending', 'queued', 'in_progress'].includes(r.status)
            );
            for (const run of old) {
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info(`停止指示: #${run.id} (${run.head_sha})`);
              } catch (error) {
                if ([404, 409, 422].includes(error.status)) {
                  core.info(`既に終了: #${run.id} (${error.status})`);
                } else {
                  throw error;
                }
              }
            }
            core.info(`旧ビルド ${old.length} 件の停止を要求しました`);
  build:
    needs: stop-outdated
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Nuitka writes ccache/clcache and its other compilation caches here.
      # GitHub runners are ephemeral; restore/save makes the directory persistent.
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - name: ソース取得
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Nuitkaコンパイルキャッシュを復元
        id: nuitka-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          # Unique per run (immutable cache); previous compatible build is restored
          # using the prefix below. Package/Python/OS changes split the cache.
          key: nuitka-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt') }}-
      - name: Onefile EXEビルド
        id: nuitka-build
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Nuitkaコンパイルキャッシュを保存
        if: ${{ steps.nuitka-build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}
      - name: Onefile起動・外部SQLite永続化の検証
        shell: pwsh
        run: python scripts/verify_onefile_runtime.py "build/SparePartsManagement.exe"
      - name: EXE成果物保存
        uses: actions/upload-artifact@v4
        with:
          name: SparePartsManagement-onefile
          path: build/SparePartsManagement.exe
          if-no-files-found: error
      - name: 配布用ZIPをGitへコミット
        if: ${{ github.ref == 'refs/heads/Release' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Compress-Archive -Path 'build/SparePartsManagement.exe' -DestinationPath 'releases/SparePartsManagement-onefile.zip' -CompressionLevel Optimal -Force
          # Remove the superseded multi-file distribution to prevent accidental use.
          git rm --ignore-unmatch releases/SparePartsManagement-standalone.zip
          if ($LASTEXITCODE -ne 0) { throw 'Legacy distribution cleanup failed' }
          git fetch origin $env:GITHUB_REF_NAME
          $remoteHead = (git rev-parse FETCH_HEAD).Trim()
          $localHead = (git rev-parse HEAD).Trim()
          if ($remoteHead -ne $localHead) {
            # Documentation updates must not invalidate a correctly built binary.
            # Never publish a stale binary if executable code changed.
            $changedPaths = @(git diff --name-only $localHead $remoteHead)
            $codeChanges = @($changedPaths | Where-Object { $_ -notin @('docs/progress.md', 'README.md') })
            if ($codeChanges.Count -gt 0) {
              Write-Host 'より新しいソースがあるため、古い成果物の登録を省略します'
              exit 0
            }
            git merge --ff-only FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Documentation-only fast-forward failed' }
            Write-Host '文書更新を取り込んで最新版の配布を継続します'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $progressPath = 'docs/progress.md'
          $progress = Get-Content $progressPath -Raw -Encoding UTF8
          $progress = $progress -replace '(?m)^- Windows standalone:.*$', '- Windows onefile: GitHub ActionsでコンパイルとSQLite永続化を検証、配布ZIPをGitへ登録済み。GUI実機確認は未完了'
          $progress = $progress -replace '(?m)^\| Nuitka Windows standalone/onefile \|[^\r\n]*$', '| Nuitka Windows standalone/onefile | Onefile配布に切替済み | GitHub Actions Onefileの起動・外部DB保持・配布ZIP登録成功 | GUI実機は未確認 |'
          $progress = $progress -replace '(?m)^- 配布成果物ビルド元:.*\r?\n', ''
          $progress += "`n- 配布成果物ビルド元: $localHead`n"
          $progress += "- EXEアイコン: gear / spare parts box（256〜16px、EXEに埋込み）`n"
          Set-Content -Path $progressPath -Value $progress -Encoding UTF8
          git add -A releases docs/progress.md assets/spare_parts.ico frontend/src/assets/spare_parts.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '成果物に変更はありません'
            exit 0
          }
          git commit -m 'Windows用Onefile EXE配布成果物を更新'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:$env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
