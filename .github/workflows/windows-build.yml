name: Windows Nuitkaビルド

on:
  workflow_dispatch:
  push:
    branches: [Release]
    tags:
      - "v*"
    paths-ignore:
      - "releases/**"
      - "docs/progress.md"
      - "assets/spare_parts.ico"
      - "frontend/src/assets/spare_parts.png"
      # Workflow-only changes do not alter the packaged app. Use manual dispatch
      # for a build-configuration-only change.
      - ".github/workflows/windows-build.yml"

# Every branch/tag dispatch belongs to one build slot. A newer run cancels
# an older run before its Windows compiler can publish outdated binaries.
concurrency:
  group: spare-parts-windows-standalone
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  stop-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: 旧Windowsビルドを停止
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'windows-build.yml', per_page: 100
            });
            const old = runs.filter(r =>
              r.id < context.runId &&
              ['requested', 'waiting', 'pending', 'queued', 'in_progress'].includes(r.status)
            );
            for (const run of old) {
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info(`停止指示: #${run.id} (${run.head_sha})`);
              } catch (error) {
                if ([404, 409, 422].includes(error.status)) {
                  core.info(`既に終了: #${run.id} (${error.status})`);
                } else {
                  throw error;
                }
              }
            }
            core.info(`旧ビルド ${old.length} 件の停止を要求しました`);
  build:
    needs: stop-outdated
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # Nuitka writes ccache/clcache and its other compilation caches here.
      # GitHub runners are ephemeral; restore/save makes the directory persistent.
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - name: ソース取得
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Nuitkaコンパイルキャッシュを復元
        id: nuitka-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          # Unique per run (immutable cache); previous compatible build is restored
          # using the prefix below. Package/Python/OS changes split the cache.
          key: nuitka-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt') }}-
      - name: Onefile・Standalone両方をビルド
        id: nuitka-build
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Both
      - name: Nuitkaコンパイルキャッシュを保存
        if: ${{ steps.nuitka-build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}
      - name: Onefile EXE成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: SparePartsManagement-onefile
          path: build/SparePartsManagement.exe
          if-no-files-found: error
      - name: Standalone成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: SparePartsManagement-standalone
          path: build/launcher.dist/
          if-no-files-found: error
      - name: 両方式をreleasesへ配布登録
        if: ${{ github.ref == 'refs/heads/Release' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = 'build/SparePartsManagement.exe'
          $standalonePath = 'build/launcher.dist/SparePartsManagement.exe'
          if (-not (Test-Path $exePath -PathType Leaf)) { throw 'Onefile EXEがありません' }
          if (-not (Test-Path $standalonePath -PathType Leaf)) { throw 'Standalone EXEがありません' }
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          $standaloneZip = 'releases/SparePartsManagement-standalone.zip'
          Compress-Archive -Path 'build/launcher.dist/*' -DestinationPath $standaloneZip -CompressionLevel Optimal -Force

          git fetch origin $env:GITHUB_REF_NAME
          $remoteHead = (git rev-parse FETCH_HEAD).Trim()
          $localHead = (git rev-parse HEAD).Trim()
          if ($remoteHead -ne $localHead) {
            $changedPaths = @(git diff --name-only $localHead $remoteHead)
            $codeChanges = @($changedPaths | Where-Object { $_ -notin @('docs/progress.md', 'README.md') })
            if ($codeChanges.Count -gt 0) {
              Write-Host 'ソースが更新されているので、旧版成果物は登録しません'
              exit 0
            }
            git merge --ff-only FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw '進捗文書の更新を取り込めませんでした' }
          }

          $onefileSize = (Get-Item $exePath).Length
          $standaloneSize = (Get-Item $standaloneZip).Length
          $buildTag = "windows-$($localHead.Substring(0,12))"
          $gitThreshold = 90MB
          $useReleaseAssets = ($onefileSize -gt $gitThreshold) -or ($standaloneSize -gt $gitThreshold)
          if ($useReleaseAssets) {
            # Keep both files together if either exceeds Git's per-blob limit.
            gh release create $buildTag "$exePath#SparePartsManagement.exe" "$standaloneZip#SparePartsManagement-standalone.zip" --target $localHead --title "Windows配布 $($localHead.Substring(0,12))" --notes "Onefile単体EXEとStandalone ZIPの両方を収録。SQLiteはEXEの隣のdata/inventory.sqlite3に保存します。"
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Releasesへの成果物登録に失敗しました' }
          } else {
            Copy-Item $exePath 'releases/SparePartsManagement.exe' -Force
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $progressPath = 'docs/progress.md'
          $progress = Get-Content $progressPath -Raw -Encoding UTF8
          $progress = $progress -replace '(?m)^- Windows standalone:.*$', '- Windows Onefile・Standalone: 両方式をビルドして配布登録済み。Windows実機GUIは未確認'
          $progress = $progress -replace '(?m)^\| Nuitka Windows standalone/onefile \|[^\r\n]*$', '| Nuitka Windows standalone/onefile | 両方式ビルド成功 | EXEとStandalone ZIPを配布済み | Windows実機GUI未確認 |'
          $progress = $progress -replace '(?m)^- 配布成果物ビルド元:.*\r?\n', ''
          $progress = $progress -replace '(?m)^- Onefile成果物:.*\r?\n', ''
          $progress += "`n- 配布成果物ビルド元: $localHead`n"
          $progress += "- 配布成果物: Onefile EXE $onefileSize bytes、Standalone ZIP $standaloneSize bytes（Git制限超過時はGitHub Releases）`n"
          Set-Content -Path $progressPath -Value $progress -Encoding UTF8
          git add docs/progress.md assets/spare_parts.ico frontend/src/assets/spare_parts.png
          if ($useReleaseAssets) {
            git rm -f --ignore-unmatch releases/SparePartsManagement.exe releases/SparePartsManagement-standalone.zip
          } else {
            git add -f releases/SparePartsManagement.exe releases/SparePartsManagement-standalone.zip
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '配布成果物に変更はありません'
            exit 0
          }
          git commit -m 'Windows OnefileとStandaloneの配布成果物を更新'
          if ($LASTEXITCODE -ne 0) { throw 'コミットに失敗しました' }
          git push origin HEAD:$env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw '配布物のプッシュに失敗しました' }
