name: 予備品管理 CI

on:
  push:
    branches: [Release, "feature/**"]
    paths-ignore:
      - "releases/**"
      - "docs/progress.md"
      - "assets/spare_parts.ico"
      - "frontend/src/assets/spare_parts.png"
  pull_request:
    branches: [Release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-stale-windows:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/initial-implementation' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 旧開発ブランチのWindowsビルドをキャンセル
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'windows-build.yml', per_page: 100
            });
            const obsolete = runs.filter(r =>
              r.head_branch === 'feature/initial-implementation' &&
              ['requested', 'waiting', 'pending', 'queued', 'in_progress'].includes(r.status)
            );
            for (const run of obsolete) {
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info(`停止指示: #${run.id}`);
              } catch (error) {
                if (![404, 409, 422].includes(error.status)) throw error;
              }
            }
            core.info(`停止対象: ${obsolete.length} 件`);
  django-and-react:
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Python依存導入
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m nuitka --version
      - name: GUIとWindowsアイコンを生成
        run: python scripts/prepare_icon.py
      - name: ネイティブウィンドウとタスクバーのアイコン設定テスト
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: DBマイグレーション検査
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Django在庫・APIテスト
        run: python backend/manage.py test inventory --verbosity 2
      - name: React依存導入
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript / Reactビルド
        working-directory: frontend
        run: npm run build
      - name: Djangoから静的画面を配信する検査
        run: |
          python backend/manage.py check
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "backend")
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.test import Client
          result = Client().get("/")
          assert result.status_code == 200, result.status_code
          assert b"/assets/" in result.content
          favicon = Client().get("/favicon.ico")
          assert favicon.status_code == 200
          assert b"".join(favicon.streaming_content).startswith(b"\x00\x00\x01\x00")
          print("React static delivery OK")
          PY

      - name: Django DBを初期化
        run: python backend/manage.py migrate --noinput
      - name: Playwrightを一時導入
        working-directory: frontend
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Chromiumを導入
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: React UIのブラウザ操作を検証
        working-directory: frontend
        run: node scripts/smoke.mjs

  windows-native-launcher:
    runs-on: windows-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: アイコン生成に必要なPillowを導入
        run: python -m pip install Pillow==12.3.0
      - name: アイコンを生成
        run: python scripts/prepare_icon.py
      - name: ネイティブランチャーをMSVCでコンパイル
        shell: pwsh
        run: ./scripts/build_native_launcher.ps1 -OutputFile build/native-check/SparePartsManagement.exe
      - name: Windows通知ライブラリの互換性を検査
        run: |
          python -m pip install "windows-toasts==1.3.1"
          python -c "from windows_toasts import WindowsToaster, Toast; print('Windows toast imports OK')"
      - name: EXEのアイコン埋込を確認
        run: python scripts/verify_windows_icon.py build/native-check/SparePartsManagement.exe

  merge-warning-cleanup-after-windows:
    # Wait for the exact running Release build without cancelling it.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/next-build-warning-cleanup' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [django-and-react, windows-native-launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: warning-cleanup-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: 現行Windows配布成功を確認して警告対応PRを統合
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const expectedHead = context.payload.pull_request.head.sha;
            const previousBuildRunId = 38827800102;
            const previousBuildHead = 'd4c1f2a49fc9944ababa3898f00dcc257d40b82a';
            let ready = false;
            for (let attempt = 0; attempt < 165; attempt++) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: previousBuildRunId,
              });
              if (run.head_sha !== previousBuildHead) {
                throw new Error('監視対象のWindowsビルドのコミットが一致しません');
              }
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error('現行Windowsビルドが成功しなかったためPRをマージしません: ' + run.conclusion);
                }
                ready = true;
                break;
              }
              core.info('現行Windowsビルド #' + previousBuildRunId + ' の完了待ち（' + run.status + '）');
              await new Promise(resolve => setTimeout(resolve, 60000));
            }
            if (!ready) throw new Error('現行Windowsビルドの完了待ちが制限時間を超えました');
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number});
            if (pr.merged) { core.info('PRは既に統合済みです'); return; }
            if (pr.state !== 'open' || pr.base.ref !== 'Release' ||
                pr.head.ref !== 'feature/next-build-warning-cleanup' ||
                pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo ||
                pr.head.sha !== expectedHead) {
              throw new Error('PRが変更されたため、自動マージを中止します');
            }
            const {data: result} = await github.rest.pulls.merge({
              owner, repo, pull_number, sha: expectedHead,
              merge_method: 'merge',
              commit_title: 'Windowsビルド警告対応をReleaseへ統合',
              commit_message: 'Nuitka 4.3・Node.js 24対応Actions・重複リソース・GitHub Releases配布を更新。先行WindowsビルドとPR CIの成功後に統合。',
            });
            if (!result.merged) throw new Error('PRの統合に失敗しました');
            core.info('PR統合成功: ' + result.sha);
            // GITHUB_TOKEN-generated merge push does not trigger push workflows.
            // workflow_dispatch is explicitly permitted and runs the next build.
            for (const workflow_id of ['ci.yml', 'windows-build.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: 'Release',
              });
              core.info('Release検証を起動: ' + workflow_id);
            }
